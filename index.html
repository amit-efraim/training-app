<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master Swimmer Training Logger</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --card-border: #334155;
      --pool: #38bdf8; --dryland: #f97316; --mobility: #10b981; 
      --text: #f8fafc; --text-muted: #94a3b8;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.35rem; color: #fff; }
    
    .hud-bar { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 16px; margin-bottom: 20px; display: flex; align-items: center; gap: 16px; }
    .hud-icon { font-size: 2rem; }
    .hud-info { flex: 1; }
    .hud-label { font-size: 0.8rem; text-transform: uppercase; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; }
    .hud-val { font-size: 1.4rem; font-weight: 800; color: #fff; }
    .progress-bar-outer { background: #0f172a; border-radius: 999px; height: 8px; width: 100%; margin-top: 6px; overflow: hidden; border: 1px solid var(--card-border); }
    .progress-bar-inner { background: linear-gradient(90deg, var(--success), var(--warning), var(--danger)); height: 100%; width: 0%; transition: width 0.4s ease; }
    
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 7px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
    .tab-btn.active { background: #fff; color: #0f172a; border-color: #fff; }
    
    .cycle-control { display: flex; gap: 6px; align-items: center; background: var(--card-bg); padding: 5px 8px; border-radius: 8px; border: 1px solid var(--card-border); }
    .cycle-btn { background: transparent; border: 1px solid var(--card-border); color: var(--text); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; }
    .cycle-btn.active { background: #fff; color: #0f172a; border-color: #fff; }
    
    .day-selector { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; }
    .day-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text); padding: 10px; border-radius: 8px; cursor: pointer; text-align: center; }
    .day-btn.active { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
    .day-btn .status-dot { width: 8px; height: 8px; border-radius: 50%; margin: 4px auto 0; background: var(--card-border); }
    .day-btn.has-logs .status-dot { background: var(--success); }

    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .card h2 { font-size: 1.15rem; margin-bottom: 14px; color: #fff; border-bottom: 1px solid var(--card-border); padding-bottom: 8px; }
    
    .target-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-bottom: 10px; }
    .target-table th, .target-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--card-border); }
    .target-table th { color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 0.75rem; }
    .row-pool td:first-child { color: var(--pool); font-weight: 700; }
    .row-dryland td:first-child { color: var(--dryland); font-weight: 700; }
    .row-mobility td:first-child { color: var(--mobility); font-weight: 700; }

    .add-block-row { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .btn { background: #fff; color: #0f172a; border: none; padding: 9px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-pool { background: rgba(56, 189, 248, 0.15); color: var(--pool); border: 1px solid var(--pool); }
    .btn-dryland { background: rgba(249, 115, 22, 0.15); color: var(--dryland); border: 1px solid var(--dryland); }
    .btn-mobility { background: rgba(16, 185, 129, 0.15); color: var(--mobility); border: 1px solid var(--mobility); }
    .btn-pool:hover { background: var(--pool); color: #0f172a; }
    .btn-dryland:hover { background: var(--dryland); color: #0f172a; }
    .btn-mobility:hover { background: var(--mobility); color: #0f172a; }

    .session-block { background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; padding: 14px; margin-bottom: 16px; border-left: 4px solid var(--card-border); }
    .session-block.type-pool { border-left-color: var(--pool); }
    .session-block.type-dryland { border-left-color: var(--dryland); }
    .session-block.type-mobility { border-left-color: var(--mobility); }
    
    .session-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .session-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .type-pool .session-title { color: var(--pool); }
    .type-dryland .session-title { color: var(--dryland); }
    .type-mobility .session-title { color: var(--mobility); }

    .exercise-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .exercise-item { background: rgba(30, 41, 59, 0.6); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; display: flex; justify-content: space-between; align-items: center; }
    .item-actions button { background: transparent; border: none; color: var(--danger); cursor: pointer; margin-left: 6px; font-size: 1rem; font-weight: bold; }

    .log-controls { background: var(--card-bg); padding: 12px; border-radius: 6px; border: 1px solid var(--card-border); margin-top: 12px; }
    .slider-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
    .slider-row input[type=range] { flex: 1; accent-color: var(--warning); }
    
    .vol-badges { display: flex; gap: 4px; margin-bottom: 12px; }
    .vol-badge { flex: 1; text-align: center; font-size: 0.75rem; padding: 6px 2px; border-radius: 4px; border: 1px solid var(--card-border); background: #0f172a; color: var(--text-muted); cursor: pointer; font-weight: 600; }
    .vol-badge.active { background: #fff; color: #0f172a; border-color: #fff; }
    .vol-badge.active.vol-short { background: #3b82f6; border-color: #3b82f6; color: #fff; }
    .vol-badge.active.vol-med { background: #eab308; border-color: #eab308; color: #0f172a; }
    .vol-badge.active.vol-long { background: #ef4444; border-color: #ef4444; color: #fff; }

    .recovery-block { background: rgba(34, 197, 94, 0.1); border: 1px solid var(--success); border-radius: 10px; padding: 18px; margin-top: 24px; }
    .recovery-block h3 { color: var(--success); font-size: 1.05rem; margin-bottom: 10px; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 20px; width: 90%; max-width: 450px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    label { font-size: 0.85rem; font-weight: 600; color: var(--text-muted); }
    select, input { background: #0f172a; border: 1px solid var(--card-border); color: var(--text); padding: 8px 10px; border-radius: 6px; outline: none; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Training Logger (v34)</h1>
    </div>
    <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
      <div class="nav-tabs">
        <button class="tab-btn active" id="tabLogger" onclick="switchView('logger')">Logger</button>
        <button class="tab-btn" id="tabDatabase" onclick="switchView('database')">Database / Sync</button>
      </div>
      <div class="cycle-control" id="cycleControls">
        <span style="font-size: 0.8rem; font-weight: 600;" id="cycleLabel">C1:</span>
        <div id="dynamicWeekButtons" style="display: flex; gap: 4px;"></div>
      </div>
    </div>
  </header>

  <div class="hud-bar">
    <div class="hud-icon">⚡</div>
    <div class="hud-info">
      <div class="hud-label">Accumulated Fatigue Buffer</div>
      <div class="hud-val" id="hudLoad">0 / 400 pts</div>
      <div class="progress-bar-outer"><div class="progress-bar-inner load-bar-inner" id="hudLoadBar"></div></div>
    </div>
  </div>

  <div id="loggerView">
    <div class="day-selector" id="daySelector"></div>

    <div class="card" id="blueprintGuide">
      <h2>Weekly Guide: <span id="weekTitle" style="color: #fff; font-weight: 400;"></span></h2>
      <table class="target-table" id="targetTable">
        <!-- Injected via JS -->
      </table>
    </div>

    <div class="add-block-row">
      <button class="btn btn-pool" onclick="addSessionBlock('Pool')">+ Add Pool Block</button>
      <button class="btn btn-dryland" onclick="addSessionBlock('Dryland')">+ Add Dryland Block</button>
      <button class="btn btn-mobility" onclick="addSessionBlock('Mobility')">+ Add Mobility Block</button>
    </div>

    <div id="sessionBlocksContainer">
      <!-- Blocks go here -->
    </div>

    <div class="recovery-block">
      <h3>Daily Recovery / Rest Score</h3>
      <div class="slider-row">
        <span style="font-size: 0.85rem; color: var(--text-muted); width: 40px;">Score:</span>
        <input type="range" id="globalRecovery" min="0" max="10" step="0.5" value="5" oninput="document.getElementById('recVal').innerText = this.value;" style="accent-color: var(--success);" />
        <strong id="recVal" style="color: var(--success); font-size: 1.2rem; min-width: 30px; text-align: right;">5.0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
        <span style="font-size: 0.8rem; color: var(--text-muted);">Negates fatigue (Score × 10). Typical sleep = 5.0.</span>
        <button class="btn" style="background: var(--success); color: #0f172a;" onclick="saveRecovery()">💾 Save Recovery</button>
      </div>
    </div>
  </div>

  <!-- DATABASE VIEW -->
  <div id="databaseView" style="display: none;">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h2>Google Drive Sync</h2>
        <button class="btn" style="background: var(--danger); color: #fff; padding: 4px 8px; font-size: 0.8rem;" onclick="factoryReset()">⚠️ Hard Reset</button>
      </div>
      <div class="form-group" style="margin-bottom: 16px;">
        <label>Google OAuth Client ID</label>
        <input type="text" id="gcpClientId" placeholder="YOUR_CLIENT_ID.apps.googleusercontent.com" />
        <button class="btn" style="background: var(--success); color: #0f172a; margin-top: 6px; width: max-content; padding: 4px 10px; font-size: 0.85rem;" onclick="saveClientId()">Save ID</button>
      </div>

      <div style="background: rgba(15, 23, 42, 0.4); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
        <strong style="display: block; margin-bottom: 8px; font-size: 0.95rem; color: var(--pool);">1. Catalog & Blueprints</strong>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn btn-pool" style="padding: 6px 12px;" onclick="authenticateDrive('push', 'catalog')">☁️ Push Catalog</button>
          <button class="btn btn-pool" style="padding: 6px 12px;" onclick="authenticateDrive('pull', 'catalog')">⬇️ Pull Catalog</button>
          <button class="btn" style="padding: 6px 12px;" onclick="loadDataFromClipboard()">Load JSON Manually</button>
        </div>
      </div>

      <div style="background: rgba(15, 23, 42, 0.4); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px;">
        <strong style="display: block; margin-bottom: 8px; font-size: 0.95rem; color: var(--success);">2. Training Logs & History</strong>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn" style="background: var(--success); color: #0f172a; padding: 6px 12px;" onclick="authenticateDrive('push', 'state')">☁️ Push Logs</button>
          <button class="btn" style="background: var(--success); color: #0f172a; padding: 6px 12px;" onclick="authenticateDrive('pull', 'state')">⬇️ Pull Logs</button>
        </div>
      </div>
      <div id="syncStatus" style="font-size: 0.85rem; margin-top: 12px; color: var(--warning);"></div>
      <label style="margin-top: 16px; display: block;">Catalog JSON (Read/Write)</label>
      <textarea id="jsonArea" rows="6" style="width: 100%; margin-top: 4px; font-family: monospace; font-size: 0.8rem; background: #0f172a; color: var(--text); border: 1px solid var(--card-border); padding: 8px;"></textarea>
    </div>
  </div>

  <!-- ADD EXERCISE MODAL -->
  <div class="modal-backdrop" id="exerciseModal">
    <div class="modal">
      <h2 style="margin-bottom: 12px; color: #fff;">Add Exercise</h2>
      <form onsubmit="saveModalExercise(event)">
        <input type="hidden" id="modalBlockId" />
        <input type="hidden" id="modalBlockType" />
        
        <div class="form-group">
          <label>Select Exercise</label>
          <select id="modalExerciseSelect" required onchange="handleExerciseSelectChange()"></select>
        </div>

        <!-- Create New Form (Hidden by Default) -->
        <div id="createNewContainer" style="display: none; background: rgba(56, 189, 248, 0.1); border: 1px dashed var(--pool); padding: 12px; border-radius: 8px; margin-bottom: 12px; margin-top: 8px;">
            <strong style="color: var(--pool); font-size: 0.85rem; display: block; margin-bottom: 8px;">Create Custom Exercise</strong>
            <div class="form-group">
                <label>Exercise Name</label>
                <input type="text" id="newExName" placeholder="e.g. Parachute Sprints" />
            </div>
            <div class="form-group">
                <label>Focal Category</label>
                <select id="newExCategory">
                    <!-- Populated dynamically based on block type -->
                </select>
            </div>
            <div class="form-group">
                <label>Equipment (Optional)</label>
                <input type="text" id="newExEquip" placeholder="e.g. Fins, KB" />
            </div>
            <label style="display: flex; align-items: center; gap: 8px; margin-top: 8px; cursor: pointer;">
                <input type="checkbox" id="newExSaveCatalog" checked style="width: auto;" />
                <span style="color: #fff;">Save permanently to Catalog</span>
            </label>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px;">
          <button type="button" class="btn" style="background: transparent; color: #fff; border: 1px solid var(--card-border);" onclick="closeExerciseModal()">Cancel</button>
          <button type="submit" class="btn" style="background: var(--pool); color: #0f172a;">Add to Block</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const DAYS = [
      { id: "sun", name: "Sunday", short: "Sun" }, { id: "mon", name: "Monday", short: "Mon" },
      { id: "tue", name: "Tuesday", short: "Tue" }, { id: "wed", name: "Wednesday", short: "Wed" },
      { id: "thu", name: "Thursday", short: "Thu" }, { id: "fri", name: "Friday", short: "Fri" },
      { id: "sat", name: "Saturday", short: "Sat" }
    ];

    const LOAD_BUFFER_THRESHOLD = 400;

    let appData = JSON.parse(localStorage.getItem("swim_tracker_app_data"));
    let metaState = JSON.parse(localStorage.getItem("swim_tracker_meta")) || { cycle: 1, week: 1, activeWeeks: 4, overrides: {} };
    let logs = JSON.parse(localStorage.getItem("swim_tracker_logs")) || {};
    let engineState = JSON.parse(localStorage.getItem("swim_tracker_engine")) || { accumulatedLoad: 0 };

    // Migration to 34.0 (Pure Logger)
    if (!appData || appData.version < 34.0) {
      if(appData) appData.version = 34.0;
      else appData = { version: 34.0, exercise_catalog: {}, mesocycle_structure: {} };
      localStorage.setItem("swim_tracker_app_data", JSON.stringify(appData));
      
      // Wipe legacy planner states safely
      localStorage.removeItem("swim_tracker_generated_plans");
      localStorage.removeItem("swim_tracker_gamify");
    }

    let currentDay = DAYS[new Date().getDay()].id;

    function init() {
      document.getElementById("gcpClientId").value = localStorage.getItem("gdrive_client_id") || "";
      calculateChronologicalLoad();
      updateDynamicWeekButtons();
      renderHUD();
      renderDaySelector();
      renderDayView();
      document.getElementById("jsonArea").value = JSON.stringify(appData, null, 2);
    }

    function switchView(view) {
      document.getElementById("loggerView").style.display = view === "logger" ? "block" : "none";
      document.getElementById("databaseView").style.display = view === "database" ? "block" : "none";
      document.getElementById("cycleControls").style.display = view === "logger" ? "flex" : "none";
      document.getElementById("tabLogger").classList.toggle("active", view === "logger");
      document.getElementById("tabDatabase").classList.toggle("active", view === "database");
    }

    function updateDynamicWeekButtons() {
      document.getElementById("cycleLabel").innerText = `C${metaState.cycle}:`;
      const container = document.getElementById("dynamicWeekButtons");
      container.innerHTML = "";
      
      for (let w = 1; w <= metaState.activeWeeks; w++) {
        const btn = document.createElement("button");
        btn.className = `cycle-btn ${w === metaState.week ? "active" : ""}`;
        btn.innerText = w === 4 ? "Deload" : `W${w}`;
        btn.onclick = () => { metaState.week = w; saveMeta(); init(); };
        container.appendChild(btn);
      }
    }

    function renderDaySelector() {
      const container = document.getElementById("daySelector");
      container.innerHTML = "";
      DAYS.forEach(day => {
        const logKey = `c${metaState.cycle}_w${metaState.week}_${day.id}`;
        const hasData = logs[logKey] && (logs[logKey].blocks?.length > 0 || logs[logKey].recovery > 0);
        
        const btn = document.createElement("button");
        btn.className = `day-btn ${day.id === currentDay ? "active" : ""} ${hasData ? "has-logs" : ""}`;
        btn.onclick = () => { currentDay = day.id; renderDaySelector(); renderDayView(); };
        btn.innerHTML = `<span style="font-weight:700;font-size:0.9rem;">${day.short}</span><span class="status-dot"></span>`;
        container.appendChild(btn);
      });
    }

    // --- MATHEMATICS (CHRONOLOGICAL) ---
    function calculateChronologicalLoad() {
      let netLoad = 0;
      const dayOrder = { "sun": 0, "mon": 1, "tue": 2, "wed": 3, "thu": 4, "fri": 5, "sat": 6 };
      
      const sortedLogs = Object.entries(logs).sort((a, b) => {
         const [cA, wA, dA] = a[0].split('_');
         const [cB, wB, dB] = b[0].split('_');
         const cycA = parseInt(cA.replace('c','')) || 0;
         const cycB = parseInt(cB.replace('c','')) || 0;
         if (cycA !== cycB) return cycA - cycB;
         const wkA = parseInt(wA.replace('w','')) || 0;
         const wkB = parseInt(wB.replace('w','')) || 0;
         if (wkA !== wkB) return wkA - wkB;
         return (dayOrder[dA] || 0) - (dayOrder[dB] || 0);
      });

      sortedLogs.forEach(([key, entry]) => {
          let dailyGrossLoad = 0;
          if (entry.blocks) {
              entry.blocks.forEach(b => {
                 dailyGrossLoad += (b.rpe || 0) * (b.volume || 1.0) * 10; 
              });
          }
          const recScore = entry.recovery !== undefined ? entry.recovery : 0; 
          const recClearance = recScore * 10; // 1.0x Scale. e.g. Score 5.0 clears 50 points.
          
          netLoad += (dailyGrossLoad - recClearance);
          netLoad = Math.max(0, netLoad); // Daily zero floor! No negative banking.
      });
      
      engineState.accumulatedLoad = netLoad;
      saveMeta();
    }

    function renderHUD() {
      const loadPercent = Math.min(100, (engineState.accumulatedLoad / LOAD_BUFFER_THRESHOLD) * 100);
      document.getElementById("hudLoad").innerText = `${Math.round(engineState.accumulatedLoad)} / ${LOAD_BUFFER_THRESHOLD} pts`;
      const loadBar = document.getElementById("hudLoadBar");
      loadBar.style.width = `${loadPercent}%`;
      loadBar.style.background = engineState.accumulatedLoad >= LOAD_BUFFER_THRESHOLD ? "var(--danger)" : "linear-gradient(90deg, var(--success), var(--warning), var(--danger))";
    }

    // --- MAIN RENDERER ---
    function renderDayView() {
      // 1. Render Blueprint Targets Table
      const phaseKey = metaState.week === 4 ? "deload" : `week${metaState.week}`;
      const blueprint = appData.mesocycle_structure[phaseKey] || { phaseName: "No Data", targets: [] };
      document.getElementById("weekTitle").innerText = blueprint.phaseName;
      
      const tbody = document.getElementById("targetTable");
      tbody.innerHTML = `<tr><th>Session Type</th><th>Weekly Count</th><th>Target RPE</th><th>Target Vol</th></tr>` + 
        blueprint.targets.map(t => {
            let rowClass = t.type.toLowerCase().includes("pool") ? "row-pool" : 
                           t.type.toLowerCase().includes("mobility") ? "row-mobility" : "row-dryland";
            return `<tr class="${rowClass}"><td>${t.type}</td><td>${t.count}</td><td>${t.rpe}</td><td>${t.volume}</td></tr>`;
        }).join('');

      // 2. Render Blocks & Recovery
      const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
      const dailyLog = logs[logKey] || { blocks: [], recovery: 5.0 };
      
      // Init missing daily log implicitly
      if(!logs[logKey]) logs[logKey] = dailyLog;

      const container = document.getElementById("sessionBlocksContainer");
      if (!dailyLog.blocks || dailyLog.blocks.length === 0) {
          container.innerHTML = `<div style="text-align: center; padding: 30px; color: var(--text-muted); font-size: 0.9rem; border: 1px dashed var(--card-border); border-radius: 8px;">No sessions logged today. Click a button above to add a block.</div>`;
      } else {
          container.innerHTML = dailyLog.blocks.map(block => renderSingleBlock(block)).join('');
      }

      // Update Recovery Slider
      document.getElementById("globalRecovery").value = dailyLog.recovery;
      document.getElementById("recVal").innerText = Number(dailyLog.recovery).toFixed(1);
    }

    function renderSingleBlock(block) {
        let typeClass = `type-${block.type.toLowerCase()}`;
        let titleColorMap = { "Pool": "var(--pool)", "Dryland": "var(--dryland)", "Mobility": "var(--mobility)" };
        let btnColorMap = { "Pool": "rgba(56, 189, 248, 0.15)", "Dryland": "rgba(249, 115, 22, 0.15)", "Mobility": "rgba(16, 185, 129, 0.15)" };

        let exercisesHtml = '';
        if(block.exercises && block.exercises.length > 0) {
            exercisesHtml = `<ul class="exercise-list">` + block.exercises.map((exId, idx) => {
                const ex = appData.exercise_catalog[exId] || { name: "Unknown", category: "Custom" };
                return `<li class="exercise-item">
                            <div><strong>${ex.name}</strong> <span style="font-size:0.75rem; color:var(--text-muted); margin-left:6px; text-transform:uppercase;">${ex.category.replace('_',' ')}</span>
                            ${ex.equipment && ex.equipment !== 'None' ? `<span style="display:block; font-size:0.75rem; color:var(--text-muted);">Eq: ${ex.equipment}</span>` : ''}</div>
                            <div class="item-actions"><button onclick="removeExercise(${block.id}, ${idx})" title="Remove Exercise">✕</button></div>
                        </li>`;
            }).join('') + `</ul>`;
        } else {
            exercisesHtml = `<div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:12px;">Empty block. Click '+ Add Exercise'</div>`;
        }

        const vol = block.volume || 1.0;
        const rpe = block.rpe || 5;
        const load = Math.round(rpe * vol * 10);

        return `
        <div class="session-block ${typeClass}" id="block_${block.id}">
            <div class="session-header">
                <span class="session-title">${block.type} Block</span>
                <button class="btn" style="background: transparent; color: var(--danger); padding: 4px; font-size:1.1rem; border:none;" onclick="deleteBlock(${block.id})" title="Delete Block">🗑️</button>
            </div>
            
            ${exercisesHtml}
            
            <button class="btn" style="background: ${btnColorMap[block.type]}; color: ${titleColorMap[block.type]}; width: 100%; margin-bottom: 16px; padding: 6px; font-size: 0.85rem;" onclick="openExerciseModal(${block.id}, '${block.type}')">+ Add Exercise</button>
            
            <div class="log-controls">
                <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:6px; font-weight:600;">SESSION EFFORT (RPE)</div>
                <div class="slider-row">
                    <input type="range" id="rpe_${block.id}" min="0" max="10" step="0.5" value="${rpe}" oninput="document.getElementById('rpe_val_${block.id}').innerText = this.value;" />
                    <strong id="rpe_val_${block.id}" style="color: #fff; font-size: 1.1rem; min-width: 25px; text-align: right;">${rpe}</strong>
                </div>
                
                <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:6px; font-weight:600; margin-top:12px;">PERFORMED VOLUME</div>
                <input type="hidden" id="vol_${block.id}" value="${vol}">
                <div class="vol-badges" id="vol_container_${block.id}">
                    <div class="vol-badge ${vol==0.5?'active vol-short':''}" onclick="setVol(${block.id}, 0.5)">Short</div>
                    <div class="vol-badge ${vol==0.75?'active':''}" onclick="setVol(${block.id}, 0.75)">Med-S</div>
                    <div class="vol-badge ${vol==1.0?'active vol-med':''}" onclick="setVol(${block.id}, 1.0)">Med</div>
                    <div class="vol-badge ${vol==1.25?'active':''}" onclick="setVol(${block.id}, 1.25)">Med-L</div>
                    <div class="vol-badge ${vol==1.5?'active vol-long':''}" onclick="setVol(${block.id}, 1.5)">Long</div>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-top:16px;">
                    <span style="font-size:0.8rem; color:var(--pool); font-weight:600;">Block Load: ${load} pts</span>
                    <button class="btn" style="background:#fff; color:#0f172a; padding:6px 16px; font-size:0.85rem;" onclick="saveBlock(${block.id})">💾 Save Block</button>
                </div>
            </div>
        </div>`;
    }

    // --- BLOCK LOGIC ---
    window.addSessionBlock = function(type) {
        const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
        if(!logs[logKey]) logs[logKey] = { blocks: [], recovery: 5.0 };
        if(!logs[logKey].blocks) logs[logKey].blocks = [];
        
        logs[logKey].blocks.push({
            id: Date.now(),
            type: type,
            exercises: [],
            volume: 1.0,
            rpe: 5.0
        });
        saveMeta();
        renderDayView();
    };

    window.deleteBlock = function(id) {
        if(confirm("Delete this entire session block?")) {
            const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
            logs[logKey].blocks = logs[logKey].blocks.filter(b => b.id !== id);
            calculateChronologicalLoad();
            renderHUD();
            renderDayView();
        }
    };

    window.removeExercise = function(blockId, exIndex) {
        const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
        const block = logs[logKey].blocks.find(b => b.id === blockId);
        if(block) {
            block.exercises.splice(exIndex, 1);
            saveMeta();
            renderDayView();
        }
    };

    window.setVol = function(blockId, val) {
        document.getElementById(`vol_${blockId}`).value = val;
        const btns = document.querySelectorAll(`#vol_container_${blockId} .vol-badge`);
        btns.forEach(b => b.className = 'vol-badge');
        if(val == 0.5) btns[0].classList.add('active', 'vol-short');
        else if(val == 0.75) btns[1].classList.add('active');
        else if(val == 1.0) btns[2].classList.add('active', 'vol-med');
        else if(val == 1.25) btns[3].classList.add('active');
        else if(val == 1.5) btns[4].classList.add('active', 'vol-long');
    };

    window.saveBlock = function(id) {
        const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
        const block = logs[logKey].blocks.find(b => b.id === id);
        if(block) {
            block.rpe = parseFloat(document.getElementById(`rpe_${id}`).value);
            block.volume = parseFloat(document.getElementById(`vol_${id}`).value);
            calculateChronologicalLoad();
            renderHUD();
            renderDayView();
        }
    };

    window.saveRecovery = function() {
        const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
        if(!logs[logKey]) logs[logKey] = { blocks: [], recovery: 5.0 };
        logs[logKey].recovery = parseFloat(document.getElementById("globalRecovery").value);
        calculateChronologicalLoad();
        renderHUD();
        alert("Recovery Logged!");
    };

    // --- MODAL & CUSTOM EXERCISE LOGIC ---
    window.openExerciseModal = function(blockId, type) {
        document.getElementById("modalBlockId").value = blockId;
        document.getElementById("modalBlockType").value = type;
        
        const select = document.getElementById("modalExerciseSelect");
        select.innerHTML = `<option value="" disabled selected>-- Select an Exercise --</option>
                            <option value="CREATE_NEW" style="font-weight:bold; color:var(--pool);">[+] Create Custom Exercise...</option>`;
        
        Object.entries(appData.exercise_catalog).forEach(([id, ex]) => {
            // Filter: Pool blocks get Pool exercises. Dryland/Mobility get Dryland exercises.
            let catMatch = (type === 'Pool' && ex.type === 'pool') || (type !== 'Pool' && ex.type === 'dryland');
            if (catMatch) {
                select.innerHTML += `<option value="${id}">${ex.name} (${ex.category})</option>`;
            }
        });

        // Setup dynamic categories for custom creation based on Block Type
        const catSelect = document.getElementById("newExCategory");
        catSelect.innerHTML = "";
        let cats = [];
        if(type === 'Pool') cats = ["aerobic", "vo2max", "speed", "technique", "kick", "custom"];
        else if(type === 'Dryland') cats = ["lower_strength", "lower_power", "upper_strength", "upper_power", "core", "aerobic", "vo2max", "custom"];
        else cats = ["mobility", "custom"];
        
        cats.forEach(c => { catSelect.innerHTML += `<option value="${c}">${c.replace('_',' ').toUpperCase()}</option>`; });
        
        document.getElementById("createNewContainer").style.display = "none";
        document.getElementById("exerciseModal").style.display = "flex";
    };

    window.handleExerciseSelectChange = function() {
        const val = document.getElementById("modalExerciseSelect").value;
        document.getElementById("createNewContainer").style.display = (val === "CREATE_NEW") ? "block" : "none";
    };

    window.closeExerciseModal = function() {
        document.getElementById("exerciseModal").style.display = "none";
        document.getElementById("newExName").value = "";
        document.getElementById("newExEquip").value = "";
    };

    window.saveModalExercise = function(e) {
        e.preventDefault();
        const blockId = parseInt(document.getElementById("modalBlockId").value);
        const blockType = document.getElementById("modalBlockType").value;
        let selectedId = document.getElementById("modalExerciseSelect").value;
        
        if (selectedId === "CREATE_NEW") {
            const name = document.getElementById("newExName").value.trim();
            if(!name) return alert("Please enter a name for the custom exercise.");
            
            const category = document.getElementById("newExCategory").value;
            const equipment = document.getElementById("newExEquip").value.trim() || "None";
            const actualType = blockType === 'Pool' ? 'pool' : 'dryland';
            
            selectedId = actualType + "_" + name.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
            
            const newEx = { name: name, type: actualType, category: category, equipment: equipment, notes: "" };
            
            // Add directly to catalog if checkbox is checked
            if (document.getElementById("newExSaveCatalog").checked) {
                appData.exercise_catalog[selectedId] = newEx;
                localStorage.setItem("swim_tracker_app_data", JSON.stringify(appData));
                document.getElementById("jsonArea").value = JSON.stringify(appData, null, 2);
            } else {
                // Temporary catalog entry just so the UI renders it properly for this session
                if(!appData.exercise_catalog[selectedId]) appData.exercise_catalog[selectedId] = newEx; 
            }
        }

        const logKey = `c${metaState.cycle}_w${metaState.week}_${currentDay}`;
        const block = logs[logKey].blocks.find(b => b.id === blockId);
        if(block) {
            block.exercises.push(selectedId);
            saveMeta();
            closeExerciseModal();
            renderDayView();
        }
    };

    function saveMeta() {
        localStorage.setItem("swim_tracker_meta", JSON.stringify(metaState));
        localStorage.setItem("swim_tracker_logs", JSON.stringify(logs));
        localStorage.setItem("swim_tracker_engine", JSON.stringify(engineState));
    }

    function factoryReset() {
      if (confirm("Hard Reset: This wipes ALL your logged data and sets you back to Day 1. Your JSON catalog is safe. Proceed?")) {
        logs = {};
        engineState = { accumulatedLoad: 0 };
        metaState = { cycle: 1, week: 1, activeWeeks: 4, overrides: {} };
        saveMeta();
        init();
      }
    }

    /* GOOGLE DRIVE SYNC: Unchanged mechanics, updated names */
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    let tokenClient;
    let pendingAction = null;
    let pendingTarget = null;

    function saveClientId() {
      const id = document.getElementById("gcpClientId").value.trim();
      if(id) { localStorage.setItem("gdrive_client_id", id); alert("Client ID Saved."); }
    }

    function updateSyncStatus(msg, isError=false) {
      const el = document.getElementById("syncStatus");
      el.innerText = msg; el.style.color = isError ? "var(--danger)" : "var(--success)";
    }

    function authenticateDrive(action, target) {
      const clientId = localStorage.getItem("gdrive_client_id");
      if (!clientId) return updateSyncStatus("Please enter your Google Client ID first.", true);
      updateSyncStatus(`Authenticating with Google for ${target}...`);
      pendingAction = action;
      pendingTarget = target;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId, scope: SCOPES,
        callback: (response) => {
          if (response.error) updateSyncStatus("Authentication failed.", true);
          else {
              if (pendingAction === 'push') executePush(response.access_token, pendingTarget);
              else if (pendingAction === 'pull') executePull(response.access_token, pendingTarget);
          }
        }
      });
      tokenClient.requestAccessToken();
    }

    async function executePush(token, target) {
      const fileName = target === 'catalog' ? 'swim_tracker_catalog.json' : 'swim_tracker_logs.json';
      updateSyncStatus(`Uploading ${target} to Drive...`);
      try {
        const query = encodeURIComponent(`name='${fileName}' and trashed=false`);
        const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id)`, { headers: { Authorization: `Bearer ${token}` }});
        const listData = await listRes.json();
        
        const buildPayload = () => {
            if (target === 'catalog') return JSON.stringify({ appData });
            return JSON.stringify({ logs, metaState, engineState });
        };

        if (!listData.files || listData.files.length === 0) {
          const metadata = { name: fileName, mimeType: 'application/json' };
          const form = new FormData();
          form.append('metadata', new Blob([JSON.stringify(metadata)], { type: 'application/json' }));
          form.append('file', new Blob([buildPayload()], { type: 'application/json' }));
          
          await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { Authorization: `Bearer ${token}` }, body: form });
        } else {
          const fileId = listData.files[0].id;
          await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, { method: 'PATCH', headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: buildPayload() });
        }
        updateSyncStatus(`✓ Successfully Pushed ${target} (${new Date().toLocaleTimeString()})`);
      } catch (err) { updateSyncStatus(`Upload Error: ${err.message}`, true); }
    }

    async function executePull(token, target) {
      const fileName = target === 'catalog' ? 'swim_tracker_catalog.json' : 'swim_tracker_logs.json';
      updateSyncStatus(`Downloading ${target} from Drive...`);
      try {
        const query = encodeURIComponent(`name='${fileName}' and trashed=false`);
        const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${query}&fields=files(id)`, { headers: { Authorization: `Bearer ${token}` }});
        const listData = await listRes.json();

        if (!listData.files || listData.files.length === 0) {
            return updateSyncStatus(`No ${target} found on Drive. Push to Drive first.`, true);
        }

        const fileId = listData.files[0].id;
        const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, { headers: { Authorization: `Bearer ${token}` }});
        const data = await res.json();
        
        if (target === 'catalog') {
            if(data.appData) appData = data.appData;
            localStorage.setItem("swim_tracker_app_data", JSON.stringify(appData));
        } else {
            if(data.logs) logs = data.logs;
            if(data.engineState) engineState = data.engineState;
            if(data.metaState) metaState = data.metaState;
            saveMeta();
        }

        init();
        updateSyncStatus(`✓ Successfully Pulled ${target} (${new Date().toLocaleTimeString()})`);
      } catch (err) { updateSyncStatus(`Download Error: ${err.message}`, true); }
    }

    function loadDataFromClipboard() {
      try { 
        appData = JSON.parse(document.getElementById("jsonArea").value); 
        localStorage.setItem("swim_tracker_app_data", JSON.stringify(appData));
        init(); 
        alert("Catalog loaded successfully!"); 
      } catch(e) { alert("Invalid JSON format."); }
    }

    window.onload = init;
  </script>
</body>
</html>
